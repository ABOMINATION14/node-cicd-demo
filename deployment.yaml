
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-cicd-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-cicd-demo
  template:
    metadata:
      labels:
        app: node-cicd-demo
    spec:
      containers:
        - name: node-cicd-demo
          image: YOUR_DOCKERHUB_USERNAME/node-cicd-demo:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: node-cicd-service
spec:
  type: NodePort
  selector:
    app: node-cicd-demo
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30007
